{{ define "main" }}
  {{ $ui := site.Home.Params.ui }}
  <section class="not-found shell">
    <p class="eyebrow">404</p>
    <h1>{{ $ui.not_found_title }}</h1>
    <p>{{ $ui.not_found_text }}</p>
    <a class="text-link" href="{{ site.Home.RelPermalink }}">{{ $ui.back_to_products }} <span aria-hidden="true">→</span></a>
  </section>
{{ end }}

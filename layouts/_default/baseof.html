<!doctype html>
<html lang="{{ site.Language.Locale }}" data-theme="light">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body id="top" class="{{ if .IsHome }}home-page{{ else }}product-page{{ end }}">
    {{ $ui := site.Home.Params.ui }}
    <a class="skip-link" href="#main-content">{{ $ui.skip_to_content }}</a>
    {{ partial "header.html" . }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
